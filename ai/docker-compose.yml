version: "3.9"

services:
  server_cpp:
    build:
      context: ./core/server
      dockerfile: Dockerfile
    container_name: ai_server
    ports:
      - "8088:8088"
    networks:
      - default
      - talkup-ai
    depends_on:
      behavior_analyzer:
        condition: service_started
      emotional_analyzer:
        condition: service_started
      verbal_analyzer:
        condition: service_started
      sts-service:
        condition: service_healthy

  behavior_analyzer:
    build:
      context: ./microservices/behavior-analyzer
    container_name: behavior_analyzer_services
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5051:5000"

  emotional_analyzer:
    build:
      context: ./microservices/emotional-analyzer
    container_name: emotional_analyzer_services
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5052:5000"

  sts-service:
    build: ./microservices/speech-to-speech
    container_name: talkup-sts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8002:8002"
    volumes:
      - ./llm-core/models/sup-it-v3-merged:/app/llm/sup-it-v3-merged
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:3000/v1/api}
      - SIM_INTERNAL_API_KEY=${SIM_INTERNAL_API_KEY:-talkup-dev-internal-key}
      - CUDA_VISIBLE_DEVICES=-1
      - NVIDIA_VISIBLE_DEVICES=none
      - LLM_BACKEND=hf
      - LLM_GPU_MAX_MEMORY=3GiB
      - LLM_CPU_MAX_MEMORY=8GiB
      - LLM_MAX_NEW_TOKENS=128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  verbal_analyzer:
    build:
      context: ./microservices/verbal-analyzer
    container_name: verbal_analyzer_services
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5055:5000"

networks:
  talkup-ai:
    external: true
    name: talkup-ai
