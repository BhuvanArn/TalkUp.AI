version: "3.9"

services:
  server_cpp:
    build:
      context: ./core/server
      dockerfile: Dockerfile
    container_name: ai_server
    ports:
      - "8088:8088"
    depends_on:
      - behavior_analyzer
      - emotional_analyzer
      - verbal_analyzer
      - sts-service

  behavior_analyzer:
    build:
      context: ./microservices/behavior-analyzer
    container_name: behavior_analyzer_services
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5051:5000"

  emotional_analyzer:
    build:
      context: ./microservices/emotional-analyzer
    container_name: emotional_analyzer_services
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5052:5000"

  sts-service:
    build: ./microservices/speech-to-speech
    container_name: talkup-sts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8002:8002"
    volumes:
      - ./llm-core/models/sup-it-v3-merged:/app/llm/sup-it-v3-merged
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - NVIDIA_VISIBLE_DEVICES=none
      - LLM_BACKEND=hf
      - LLM_GPU_MAX_MEMORY=2GiB
      - LLM_CPU_MAX_MEMORY=16GiB
      - LLM_MAX_NEW_TOKENS=128
    restart: unless-stopped

  verbal_analyzer:
    build:
      context: ./microservices/verbal-analyzer
    container_name: verbal_analyzer_services
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5055:5000"
