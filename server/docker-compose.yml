services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    security_opt:
      - seccomp:unconfined
      - label:disable
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    environment:
      - DOCKER_RUN=true
      - POSTGRES_DOCKER_HOST=postgres_db
      # Overrides server/.env — localhost inside this container is not the host.
      - AI_SERVER_URL=http://ai_server:8088
      - AI_WS_PUBLIC_URL=${AI_WS_PUBLIC_URL:-ws://localhost:8088/ws}
      - REDIS_URL=redis://redis:6379
      - SIM_MAX_CONCURRENT=${SIM_MAX_CONCURRENT:-2}
      - SIM_INTERNAL_API_KEY=${SIM_INTERNAL_API_KEY:-talkup-dev-internal-key}
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - server-tier
      - talkup-ai

  redis:
    image: redis:7-alpine
    networks:
      - server-tier
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: on-failure

  postgres_db:
    image: "postgres:17.4"
    networks:
      - server-tier
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure

networks:
  server-tier:
  talkup-ai:
    name: talkup-ai

volumes:
  postgres-data:
